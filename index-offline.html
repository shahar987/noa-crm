<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>נואה · מערכת ניהול לקוחות</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;800&family=Frank+Ruhl+Libre:wght@500;600;700;900&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="app/tailwind.css" />
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    html, body { height: 100%; }
    body {
      margin: 0;
      font-family: 'Heebo', system-ui, sans-serif;
      background:
        radial-gradient(1200px 600px at 100% 0%, #fbe7f0 0%, rgba(251,231,240,0) 55%),
        radial-gradient(1000px 700px at 0% 100%, #fdeef0 0%, rgba(253,238,240,0) 50%),
        #fdf6f9;
      color: #46213a;
      -webkit-font-smoothing: antialiased;
    }
    .font-display { font-family: 'Frank Ruhl Libre', serif; }

    /* lucide icon wrapper */
    .ic { display: inline-flex; align-items: center; justify-content: center; flex: none; }
    .ic svg { width: 100%; height: 100%; stroke-width: 1.9; }

    /* custom scrollbar */
    ::-webkit-scrollbar { width: 10px; height: 10px; }
    ::-webkit-scrollbar-thumb { background: #f0c0d4; border-radius: 999px; border: 3px solid transparent; background-clip: content-box; }
    ::-webkit-scrollbar-thumb:hover { background: #e69cba; background-clip: content-box; }

    /* Entrance animations are transform-only so content is NEVER hidden if the
       render timeline is paused (background tab / screenshot capture). */
    @keyframes fadeUp { from { transform: translateY(14px); } to { transform: translateY(0); } }
    @keyframes scaleIn { from { transform: translateY(8px) scale(.98); } to { transform: translateY(0) scale(1); } }
    @keyframes backdropIn { from { opacity: 0; } to { opacity: 1; } }
    .anim-fade-up { animation: fadeUp .5s cubic-bezier(.2,.8,.2,1) both; }
    .anim-scale-in { animation: scaleIn .32s cubic-bezier(.2,.9,.25,1) both; }
    .anim-fade-in { animation: backdropIn .3s ease both; }

    .stripe-ph {
      background-image: repeating-linear-gradient(135deg, #f7dbe7 0 12px, #fbedf3 12px 24px);
    }

    [data-tab-enter] { animation: fadeUp .45s cubic-bezier(.2,.8,.2,1) both; }
    @media (prefers-reduced-motion: reduce) {
      .anim-fade-up, .anim-scale-in, [data-tab-enter] { animation: none !important; }
    }
  </style>
</head>
<body>
  <template id="__bundler_thumbnail">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
      <rect width="100" height="100" rx="20" fill="#fbe8f0"/>
      <g fill="none" stroke="#c25c84" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round">
        <path d="M34 60 L34 44 L42 50 L50 40 L58 50 L66 44 L66 60 Z" fill="#e69cba" stroke="#c25c84"/>
        <line x1="34" y1="66" x2="66" y2="66"/>
      </g>
    </svg>
  </template>

  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script type="text/babel" src="app/data.jsx"></script>
  <script type="text/babel" src="app/ui.jsx"></script>
  <script type="text/babel" src="app/dashboard.jsx"></script>
  <script type="text/babel" src="app/clients.jsx"></script>
  <script type="text/babel" src="app/inventory.jsx"></script>
  <script type="text/babel" src="app/app.jsx"></script>
</body>
</html>
