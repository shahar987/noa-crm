// ===== Mock data + helpers for the Royal Princess CRM =====

// ---- helpers ----
// how many clients currently use a given product (by name)
function clientsUsing(productName, clients) {
  return clients.filter(c => c.creams.includes(productName)).length;
}

Object.assign(window, {
  PRODUCTS_SEED, CLIENTS_SEED, clientsUsing,
});


// ===== Shared UI primitives =====
const { useState, useEffect, useRef, useMemo } = React;

// ---- Icon (lucide wrapper) ----
function Icon({ name, size = 20, className = '', style = {} }) {
  const ref = useRef(null);
  useEffect(() => {
    const el = ref.current;
    if (!el || !window.lucide) return;
    el.innerHTML = `<i data-lucide="${name}"></i>`;
    window.lucide.createIcons();
  });
  return (
    <span
      ref={ref}
      className={'ic ' + className}
      style={{ width: size, height: size, ...style }}
      aria-hidden="true"
    />
  );
}

// ---- Avatar (monogram) ----
function Avatar({ name, size = 44 }) {
  const initials = (name || '?').trim().split(/\s+/).slice(0, 2).map(w => w[0]).join('');
  const hues = ['#e69cba', '#d8a799', '#c4a063', '#d97a9f', '#cf93b8'];
  let h = 0;
  for (let i = 0; i < name.length; i++) h = (h + name.charCodeAt(i)) % hues.length;
  return (
    <span
      className="inline-flex items-center justify-center rounded-full text-white font-semibold shadow-royal-sm select-none"
      style={{
        width: size, height: size, fontSize: size * 0.36,
        background: `linear-gradient(135deg, ${hues[h]}, ${hues[(h + 2) % hues.length]})`,
      }}
    >
      {initials}
    </span>
  );
}

// ---- Button ----
function Button({ variant = 'primary', size = 'md', icon, children, className = '', ...rest }) {
  const base = 'inline-flex items-center justify-center gap-2 font-semibold rounded-2xl transition-all duration-200 active:scale-[.97] focus:outline-none focus-visible:ring-4 focus-visible:ring-blush-200 disabled:opacity-50 disabled:pointer-events-none';
  const sizes = {
    sm: 'text-sm px-3.5 py-2',
    md: 'text-[15px] px-5 py-2.5',
    lg: 'text-base px-6 py-3',
  };
  const variants = {
    primary: 'text-white shadow-royal-sm hover:shadow-royal bg-gradient-to-br from-blush-500 to-rosegold-500 hover:from-blush-600 hover:to-rosegold-600',
    soft: 'bg-blush-100 text-berry-700 hover:bg-blush-200',
    ghost: 'text-berry-700/70 hover:text-berry-800 hover:bg-blush-100',
    outline: 'border border-blush-200 text-berry-700 bg-white/70 hover:bg-blush-50 hover:border-blush-300',
    danger: 'bg-rose-50 text-rose-600 hover:bg-rose-100',
  };
  const iconSize = size === 'sm' ? 16 : size === 'lg' ? 20 : 18;
  return (
    <button className={`${base} ${sizes[size]} ${variants[variant]} ${className}`} {...rest}>
      {icon && <Icon name={icon} size={iconSize} />}
      {children}
    </button>
  );
}

// ---- Badge ----
function Badge({ tone = 'rose', children, dot = false, className = '' }) {
  const tones = {
    rose:  'bg-rose-50 text-rose-600 ring-rose-200',
    amber: 'bg-amber-50 text-amber-700 ring-amber-200',
    green: 'bg-emerald-50 text-emerald-700 ring-emerald-200',
    blush: 'bg-blush-100 text-berry-700 ring-blush-200',
    gold:  'bg-amber-50 text-gold-600 ring-gold-400/40',
  };
  const dotColor = { rose: '#e11d48', amber: '#d97706', green: '#059669', blush: '#c25c84', gold: '#a8853f' };
  return (
    <span className={`inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-semibold ring-1 ring-inset ${tones[tone]} ${className}`}>
      {dot && <span className="w-1.5 h-1.5 rounded-full" style={{ background: dotColor[tone] }} />}
      {children}
    </span>
  );
}

// ---- Tag (cream pill) ----
function Tag({ children, onRemove }) {
  return (
    <span className="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-[13px] font-medium bg-blush-50 text-berry-700 ring-1 ring-inset ring-blush-200">
      <span className="w-1.5 h-1.5 rounded-full bg-rosegold-400" />
      {children}
      {onRemove && (
        <button onClick={onRemove} className="text-berry-700/40 hover:text-rose-500 transition-colors -ml-1">
          <Icon name="x" size={13} />
        </button>
      )}
    </span>
  );
}

// ---- Card ----
function Card({ children, className = '', ...rest }) {
  return (
    <div className={`bg-white/85 backdrop-blur-sm rounded-3xl border border-white shadow-royal-sm ${className}`} {...rest}>
      {children}
    </div>
  );
}

// ---- Modal ----
function Modal({ open, onClose, children, max = 'max-w-2xl' }) {
  useEffect(() => {
    if (!open) return;
    const onKey = (e) => { if (e.key === 'Escape') onClose(); };
    document.addEventListener('keydown', onKey);
    const prev = document.body.style.overflow;
    document.body.style.overflow = 'hidden';
    return () => { document.removeEventListener('keydown', onKey); document.body.style.overflow = prev; };
  }, [open, onClose]);

  if (!open) return null;
  return (
    <div
      className="fixed inset-0 z-50 overflow-y-auto bg-berry-900/30 backdrop-blur-sm anim-fade-in flex items-start justify-center p-4 sm:p-6"
      onClick={(e) => { if (e.target === e.currentTarget) onClose(); }}
    >
      <div className={`relative w-full ${max} my-8 anim-scale-in`}>
        <Card className="overflow-hidden">
          {children}
        </Card>
      </div>
    </div>
  );
}

function ModalHeader({ title, subtitle, onClose, icon }) {
  return (
    <div className="flex items-start gap-4 px-7 pt-7 pb-5 border-b border-blush-100 bg-gradient-to-l from-blush-50/60 to-transparent">
      {icon && (
        <span className="grid place-items-center w-11 h-11 rounded-2xl bg-gradient-to-br from-blush-400 to-rosegold-400 text-white shadow-royal-sm">
          <Icon name={icon} size={20} />
        </span>
      )}
      <div className="flex-1 min-w-0">
        <h2 className="font-display text-2xl font-bold text-berry-800 leading-tight">{title}</h2>
        {subtitle && <p className="text-sm text-berry-700/55 mt-0.5">{subtitle}</p>}
      </div>
      <button onClick={onClose} className="grid place-items-center w-9 h-9 rounded-xl text-berry-700/50 hover:text-berry-800 hover:bg-blush-100 transition-colors">
        <Icon name="x" size={20} />
      </button>
    </div>
  );
}

// ---- Field ----
function Field({ label, children, hint }) {
  return (
    <label className="block">
      <span className="block text-[13px] font-semibold text-berry-700/70 mb-1.5">{label}</span>
      {children}
      {hint && <span className="block text-xs text-berry-700/40 mt-1">{hint}</span>}
    </label>
  );
}

const inputCls = 'w-full rounded-2xl border border-blush-200 bg-white px-4 py-2.5 text-[15px] text-berry-800 placeholder:text-berry-700/30 focus:outline-none focus:border-blush-400 focus:ring-4 focus:ring-blush-100 transition';

function TextInput(props) { return <input {...props} className={inputCls + ' ' + (props.className || '')} />; }
function TextArea(props) { return <textarea {...props} className={inputCls + ' resize-none leading-relaxed ' + (props.className || '')} />; }

// ---- StatCard ----
function StatCard({ icon, label, value, sub, accent = 'blush', delay = 0 }) {
  const accents = {
    blush:    'from-blush-400 to-rosegold-400',
    gold:     'from-gold-400 to-rosegold-400',
    rosegold: 'from-rosegold-400 to-blush-500',
  };
  return (
    <Card className="p-6 anim-fade-up hover:shadow-royal hover:-translate-y-0.5 transition-all duration-300" style={{ animationDelay: delay + 'ms' }}>
      <div className="flex items-center justify-between">
        <span className={`grid place-items-center w-12 h-12 rounded-2xl text-white shadow-royal-sm bg-gradient-to-br ${accents[accent]}`}>
          <Icon name={icon} size={22} />
        </span>
      </div>
      <div className="mt-5">
        <div className="font-display text-[2.1rem] font-bold text-berry-800 leading-none tabular-nums">{value}</div>
        <div className="text-[15px] font-semibold text-berry-700/80 mt-2">{label}</div>
        {sub && <div className="text-[13px] text-berry-700/45 mt-1">{sub}</div>}
      </div>
    </Card>
  );
}

// ---- Empty state ----
function EmptyState({ icon, title, sub }) {
  return (
    <div className="flex flex-col items-center justify-center text-center py-16 px-6">
      <span className="grid place-items-center w-16 h-16 rounded-3xl bg-blush-100 text-blush-500 mb-4">
        <Icon name={icon} size={28} />
      </span>
      <h3 className="font-display text-xl font-bold text-berry-800">{title}</h3>
      {sub && <p className="text-sm text-berry-700/50 mt-1 max-w-xs">{sub}</p>}
    </div>
  );
}

Object.assign(window, {
  Icon, Avatar, Button, Badge, Tag, Card, Modal, ModalHeader,
  Field, TextInput, TextArea, StatCard, EmptyState, inputCls,
});


// ===== Login gate (email + password, forgot password — no registration) =====

const AUTH_KEY = 'noa_auth';

function isValidEmail(v) {
  return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v.trim());
}

function LoginScreen({ onAuth }) {
  const [mode, setMode] = useState('login'); // login | forgot | sent
  const [email, setEmail] = useState('');
  const [password, setPassword] = useState('');
  const [showPw, setShowPw] = useState(false);
  const [err, setErr] = useState('');
  const [busy, setBusy] = useState(false);

  function submitLogin(e) {
    e && e.preventDefault();
    setErr('');
    if (!isValidEmail(email)) { setErr('כתובת אימייל לא תקינה'); return; }
    if (password.trim().length < 4) { setErr('הסיסמה חייבת להכיל לפחות 4 תווים'); return; }
    setBusy(true);
    setTimeout(() => {
      try { localStorage.setItem(AUTH_KEY, email.trim()); } catch (_) {}
      setBusy(false);
      onAuth(email.trim());
    }, 650);
  }

  function submitForgot(e) {
    e && e.preventDefault();
    setErr('');
    if (!isValidEmail(email)) { setErr('נא להזין אימייל תקין לשליחת הקישור'); return; }
    setBusy(true);
    setTimeout(() => { setBusy(false); setMode('sent'); }, 700);
  }

  return (
    <div className="min-h-screen flex items-center justify-center p-5">
      {/* decorative glows */}
      <div className="fixed -top-24 -right-24 w-96 h-96 rounded-full bg-blush-200/50 blur-3xl pointer-events-none" />
      <div className="fixed -bottom-32 -left-20 w-96 h-96 rounded-full bg-rosegold-300/40 blur-3xl pointer-events-none" />

      <div className="relative w-full max-w-md">
        {/* brand */}
        <div className="flex flex-col items-center text-center mb-7 anim-fade-up">
          <span className="grid place-items-center w-16 h-16 rounded-3xl text-white shadow-royal bg-gradient-to-br from-blush-500 via-rosegold-500 to-gold-500 mb-4">
            <Icon name="crown" size={30} />
          </span>
          <h1 className="font-display text-3xl font-bold text-berry-800">נועה טל-אל</h1>
          <p className="text-berry-700/50 text-sm mt-1">קוסמטיקה מתקדמת · מערכת ניהול</p>
        </div>

        <Card className="p-7 sm:p-8 anim-fade-up" style={{ animationDelay: '80ms' }}>
          {mode === 'login' && (
            <form onSubmit={submitLogin} className="flex flex-col gap-5">
              <div>
                <h2 className="font-display text-2xl font-bold text-berry-800">כניסה לחשבון</h2>
                <p className="text-sm text-berry-700/50 mt-1">היכנסי עם האימייל והסיסמה שלך</p>
              </div>

              <Field label="אימייל">
                <div className="relative">
                  <span className="absolute right-4 top-1/2 -translate-y-1/2 text-berry-700/35"><Icon name="mail" size={18} /></span>
                  <input
                    type="email" dir="ltr" value={email}
                    onChange={e => { setEmail(e.target.value); setErr(''); }}
                    placeholder="name@example.com"
                    className={inputCls + ' pr-11 text-right'}
                    autoComplete="username"
                  />
                </div>
              </Field>

              <Field label="סיסמה">
                <div className="relative">
                  <span className="absolute right-4 top-1/2 -translate-y-1/2 text-berry-700/35"><Icon name="lock" size={17} /></span>
                  <input
                    type={showPw ? 'text' : 'password'} dir="ltr" value={password}
                    onChange={e => { setPassword(e.target.value); setErr(''); }}
                    placeholder="••••••••"
                    className={inputCls + ' pr-11 pl-11 text-right'}
                    autoComplete="current-password"
                  />
                  <button type="button" onClick={() => setShowPw(s => !s)} className="absolute left-3 top-1/2 -translate-y-1/2 grid place-items-center w-8 h-8 rounded-lg text-berry-700/40 hover:text-berry-700 hover:bg-blush-50 transition">
                    <Icon name={showPw ? 'eye-off' : 'eye'} size={17} />
                  </button>
                </div>
              </Field>

              <div className="flex justify-start -mt-1">
                <button type="button" onClick={() => { setMode('forgot'); setErr(''); }} className="text-[13px] font-semibold text-blush-600 hover:text-berry-700 transition">
                  שכחת סיסמה?
                </button>
              </div>

              {err && <div className="text-sm text-rose-600 font-medium flex items-center gap-1.5"><Icon name="alert-circle" size={15} /> {err}</div>}

              <Button type="submit" variant="primary" size="lg" className="w-full" disabled={busy}>
                {busy ? 'מתחברת…' : 'כניסה'}
              </Button>
            </form>
          )}

          {mode === 'forgot' && (
            <form onSubmit={submitForgot} className="flex flex-col gap-5">
              <button type="button" onClick={() => { setMode('login'); setErr(''); }} className="self-start text-[13px] font-semibold text-berry-700/55 hover:text-berry-800 inline-flex items-center gap-1 transition">
                <Icon name="arrow-right" size={15} /> חזרה לכניסה
              </button>
              <div>

// Build a wa.me link from an Israeli phone number (leading 0 -> 972).
function waLink(phone) {
  let d = (phone || '').replace(/\D/g, '');
  if (!d) return null;
  if (d.startsWith('0')) d = '972' + d.slice(1);
  else if (!d.startsWith('972')) d = '972' + d;
  return 'https://wa.me/' + d;
}

function openWhatsApp(phone, e) {
  if (e) e.stopPropagation();
  const url = waLink(phone);
  if (url) window.open(url, '_blank', 'noopener');
}

// ---- Inline next-appointment picker (no edit mode) ----
const HE_DAYS = ['ראשון', 'שני', 'שלישי', 'רביעי', 'חמישי', 'שישי', 'שבת'];

function formatAppt(v) {
  const d = new Date(v);
  if (isNaN(d.getTime())) return '';
  const dd = String(d.getDate()).padStart(2, '0');
  const mm = String(d.getMonth() + 1).padStart(2, '0');
  const hh = String(d.getHours()).padStart(2, '0');
  const mn = String(d.getMinutes()).padStart(2, '0');
  return `יום ${HE_DAYS[d.getDay()]} · ${dd}.${mm} · ${hh}:${mn}`;
}

function isPast(v) {
  const d = new Date(v);
  return !isNaN(d.getTime()) && d.getTime() < Date.now();
}

function AppointmentPicker({ value, onChange }) {
  const inputRef = useRef(null);
  const has = !!value;
  const past = has && isPast(value);

  function openPicker(e) {
    e.stopPropagation();
    const el = inputRef.current;
    if (!el) return;
    if (typeof el.showPicker === 'function') { try { el.showPicker(); return; } catch (_) {} }
    el.focus();
    el.click();
  }

  const tone = !has
    ? 'border-dashed border-blush-300 text-berry-700/55 bg-white hover:border-blush-400 hover:text-blush-600 hover:bg-blush-50'
    : past
      ? 'border-amber-200 text-amber-700 bg-amber-50'
      : 'border-transparent text-white bg-gradient-to-l from-blush-500 to-rosegold-500 shadow-royal-sm';

  return (
    <div className="relative inline-flex items-center gap-1" onClick={(e) => e.stopPropagation()}>
      <button
        type="button"
        onClick={openPicker}
        className={`inline-flex items-center gap-2 px-3 py-1.5 rounded-full text-[13px] font-semibold border transition ${tone}`}
      >
        <Icon name="calendar-clock" size={15} />
        {has ? formatAppt(value) : 'קביעת תור הבא'}
        {has && <Icon name="chevron-down" size={13} className="opacity-70" />}
      </button>

      {has && (
        <button
          type="button"
          onClick={(e) => { e.stopPropagation(); onChange(''); }}
          title="ביטול התור"
          className="grid place-items-center w-6 h-6 rounded-full text-berry-700/40 hover:text-rose-500 hover:bg-rose-50 transition"
        >
          <Icon name="x" size={14} />
        </button>
      )}

      {/* native picker — visually hidden, opened programmatically */}
      <input
        ref={inputRef}
        type="datetime-local"
        value={value || ''}
        onChange={(e) => onChange(e.target.value)}
        onClick={(e) => e.stopPropagation()}
        className="absolute opacity-0 w-0 h-0 pointer-events-none"
        tabIndex={-1}
        aria-hidden="true"
      />
    </div>
  );
}

function CreamSelect({ products, value, onChange }) {
  const [open, setOpen] = useState(false);
  const [query, setQuery] = useState('');
  const boxRef = useRef(null);
  const searchRef = useRef(null);

  useEffect(() => {
    function onDoc(e) { if (boxRef.current && !boxRef.current.contains(e.target)) setOpen(false); }
    document.addEventListener('mousedown', onDoc);
    return () => document.removeEventListener('mousedown', onDoc);
  }, []);
  useEffect(() => { if (open && searchRef.current) searchRef.current.focus(); }, [open]);

  function toggle(name) {
    onChange(value.includes(name) ? value.filter(c => c !== name) : [...value, name]);
  }

  const q = query.trim().toLowerCase();
  const filtered = products.filter(p => p.name.toLowerCase().includes(q));

  return (
    <div ref={boxRef} className="relative">
      {/* trigger / selected tags */}
      <div
        onClick={() => setOpen(o => !o)}
        className={`min-h-[48px] w-full rounded-2xl border bg-white px-3 py-2 flex items-center flex-wrap gap-1.5 cursor-pointer transition ${open ? 'border-blush-400 ring-4 ring-blush-100' : 'border-blush-200 hover:border-blush-300'}`}
      >
        {value.length === 0 && (
          <span className="text-berry-700/35 text-[15px] px-1">בחרי מוצרים מהרשימה…</span>

function ClientForm({ initial, products, onClose, onSave }) {
  const editing = !!initial;
  const [name, setName] = useState(initial?.name || '');
  const [phone, setPhone] = useState(initial?.phone || '');
  const [notes, setNotes] = useState(initial?.notes || '');
  const [creams, setCreams] = useState(initial?.creams || []);
  const [err, setErr] = useState('');

  function toggleCream(name) {
    setCreams(cs => cs.includes(name) ? cs.filter(c => c !== name) : [...cs, name]);
  }
  function submit() {
    if (!name.trim()) { setErr('נא להזין שם מלא'); return; }
    onSave({
      id: initial?.id || 'c' + Date.now(),
      name: name.trim(),
      phone: phone.trim() || '—',
      since: initial?.since || 'לקוחה חדשה',
      creams,
      notes: notes.trim(),
      photos: initial?.photos || [],
    });
  }

  return (
    <Modal open={true} onClose={onClose}>
      <ModalHeader
        icon={editing ? 'pencil' : 'user-plus'}
        title={editing ? 'עריכת לקוחה' : 'הוספת לקוחה חדשה'}
        subtitle={editing ? 'עדכון פרטי הלקוחה' : 'מילוי כרטיס לקוחה חדש בספר'}
        onClose={onClose}
      />
      <div className="p-7 flex flex-col gap-5">
        <div className="grid grid-cols-1 sm:grid-cols-2 gap-5">
          <Field label="שם מלא">
            <TextInput value={name} onChange={e => { setName(e.target.value); setErr(''); }} placeholder="לדוגמה: נועה לוי" />
          </Field>
          <Field label="מספר טלפון">
            <TextInput value={phone} onChange={e => setPhone(e.target.value)} placeholder="050-0000000" dir="ltr" className="text-right" />
          </Field>
        </div>

        <Field label="מוצרים משויכים" hint="חפשי ובחרי קרמים שהלקוחה משתמשת בהם">
          <CreamSelect products={products} value={creams} onChange={setCreams} />
        </Field>

        <Field label="הערות ורגישויות" hint="לדוגמה: רגישות לרטינול, עור יבש">
          <TextArea rows={4} value={notes} onChange={e => setNotes(e.target.value)} placeholder="תיעוד רגישויות, סוג עור, העדפות והנחיות טיפול…" />
        </Field>

        {err && <div className="text-sm text-rose-600 font-medium flex items-center gap-1.5"><Icon name="alert-circle" size={15} /> {err}</div>}
      </div>
      <div className="flex items-center justify-end gap-2.5 px-7 py-5 border-t border-blush-100 bg-blush-50/40">
        <Button variant="ghost" onClick={onClose}>ביטול</Button>
        <Button variant="primary" icon="check" onClick={submit}>{editing ? 'שמירת שינויים' : 'הוספת לקוחה'}</Button>
      </div>
    </Modal>
  );
}

// ---- Main directory view ----
function Clients({ clients, products, setClients, focusId, clearFocus }) {
  const [search, setSearch] = useState('');
  const [creamFilter, setCreamFilter] = useState('');
  const [openClient, setOpenClient] = useState(null);
  const [formClient, setFormClient] = useState(undefined); // undefined=closed, null=new, obj=edit
  const [confirmDel, setConfirmDel] = useState(null);

  // open profile when focused from elsewhere
  useEffect(() => {
    if (focusId) {
      const c = clients.find(c => c.id === focusId);
      if (c) setOpenClient(c);
      clearFocus && clearFocus();
    }
  }, [focusId]);

  // keep open profile synced with state updates
  const liveOpen = openClient ? clients.find(c => c.id === openClient.id) : null;

  const filtered = useMemo(() => {
    const q = search.trim().toLowerCase();
    return clients.filter(c => {
      const matchQ = !q || c.name.toLowerCase().includes(q) || c.phone.includes(q);
      const matchCream = !creamFilter || c.creams.includes(creamFilter);
      return matchQ && matchCream;
    });
  }, [clients, search, creamFilter]);

  function saveClient(data) {
    setClients(cs => {
      const exists = cs.some(c => c.id === data.id);
      return exists ? cs.map(c => c.id === data.id ? data : c) : [data, ...cs];
    });
    setFormClient(undefined);
  }
  function deleteClient(c) {
    setClients(cs => cs.filter(x => x.id !== c.id));
    setConfirmDel(null);
    if (openClient && openClient.id === c.id) setOpenClient(null);
  }
  function addPhoto(clientId, photo) {
    setClients(cs => cs.map(c => c.id === clientId ? { ...c, photos: [...c.photos, photo] } : c));
  }
  function removePhoto(clientId, photoId) {
    setClients(cs => cs.map(c => c.id === clientId ? { ...c, photos: c.photos.filter(p => p.id !== photoId) } : c));
  }
  function setAppointment(clientId, value) {
    setClients(cs => cs.map(c => c.id === clientId ? { ...c, nextAppt: value || undefined } : c));
  }

  return (
    <div data-tab-enter className="flex flex-col gap-6">
      {/* header */}
      <div className="flex items-end justify-between flex-wrap gap-4">
        <div>
          <h1 className="font-display text-3xl font-bold text-berry-800">ספר לקוחות</h1>
          <p className="text-berry-700/55 mt-1">{clients.length} לקוחות בקליניקה · {filtered.length} מוצגות</p>
        </div>
        <Button variant="primary" icon="user-plus" onClick={() => setFormClient(null)}>הוספת לקוחה</Button>
      </div>

      {/* search + filter */}
      <Card className="p-4 flex flex-col sm:flex-row gap-3">
        <div className="relative flex-1">
          <span className="absolute right-4 top-1/2 -translate-y-1/2 text-berry-700/35"><Icon name="search" size={18} /></span>
          <input
            value={search}
            onChange={e => setSearch(e.target.value)}
            placeholder="חיפוש לפי שם או טלפון…"
            className={inputCls + ' pr-11'}
          />
        </div>
        <div className="relative sm:w-72">
          <span className="absolute right-4 top-1/2 -translate-y-1/2 text-berry-700/35"><Icon name="filter" size={17} /></span>
          <select
            value={creamFilter}
            onChange={e => setCreamFilter(e.target.value)}
            className={inputCls + ' pr-11 appearance-none cursor-pointer'}
          >
            <option value="">סינון לפי קרם — הכל</option>
            {products.map(p => <option key={p.id} value={p.name}>{p.name}</option>)}
          </select>
          <span className="absolute left-4 top-1/2 -translate-y-1/2 text-berry-700/35 pointer-events-none"><Icon name="chevron-down" size={16} /></span>
        </div>
        {(search || creamFilter) && (
          <Button variant="ghost" icon="x" onClick={() => { setSearch(''); setCreamFilter(''); }}>נקה</Button>
        )}
      </Card>

      {/* active filter chip */}
      {creamFilter && (
        <div className="-mt-2 flex items-center gap-2 text-sm text-berry-700/60">
          <Icon name="info" size={15} />
          מציג לקוחות שמשתמשות ב־<strong className="text-berry-800">{creamFilter}</strong>
        </div>
      )}

      {/* grid */}
      {filtered.length ? (
        <div className="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-5">
          {filtered.map(c => (
            <ClientCard key={c.id} client={c} onOpen={setOpenClient} onEdit={setFormClient} onDelete={setConfirmDel} onSetAppt={setAppointment} />
          ))}
        </div>
      ) : (
        <Card><EmptyState icon="user-search" title="לא נמצאו לקוחות" sub="נסי לשנות את החיפוש או הסינון, או הוסיפי לקוחה חדשה." /></Card>
      )}

      {/* profile modal */}
      {liveOpen && (
        <ClientProfile
          client={liveOpen}
          products={products}
          onClose={() => setOpenClient(null)}
          onEdit={(c) => { setOpenClient(null); setFormClient(c); }}
          onAddPhoto={addPhoto}
          onRemovePhoto={removePhoto}
          onSetAppt={setAppointment}
        />
      )}

      {/* form modal */}
      {formClient !== undefined && (
        <ClientForm initial={formClient} products={products} onClose={() => setFormClient(undefined)} onSave={saveClient} />
      )}

      {/* delete confirm */}
      {confirmDel && (
        <Modal open={true} onClose={() => setConfirmDel(null)} max="max-w-md">
          <div className="p-7 text-center">
            <span className="grid place-items-center w-14 h-14 rounded-2xl bg-rose-50 text-rose-500 mx-auto mb-4"><Icon name="trash-2" size={26} /></span>
            <h2 className="font-display text-2xl font-bold text-berry-800">מחיקת לקוחה</h2>
            <p className="text-berry-700/60 mt-2">האם למחוק את <strong className="text-berry-800">{confirmDel.name}</strong> לצמיתות? פעולה זו אינה הפיכה.</p>
            <div className="flex gap-2.5 justify-center mt-6">
              <Button variant="ghost" onClick={() => setConfirmDel(null)}>ביטול</Button>
              <Button variant="danger" icon="trash-2" onClick={() => deleteClient(confirmDel)}>כן, מחקי</Button>
            </div>
          </div>
        </Modal>
      )}
    </div>
  );
}

Object.assign(window, { Clients });

function ProductForm({ initial, products, onClose, onSave }) {
  const editing = !!initial;
  const [name, setName] = useState(initial?.name || '');
  const [err, setErr] = useState('');

  function submit() {
    const v = name.trim();
    if (!v) { setErr('נא להזין שם מוצר'); return; }
    const dup = products.some(p => p.name === v && p.id !== initial?.id);
    if (dup) { setErr('מוצר בשם זה כבר קיים'); return; }
    onSave({ id: initial?.id || 'p' + Date.now(), name: v });
  }

  return (
    <Modal open={true} onClose={onClose} max="max-w-md">
      <ModalHeader
        icon={editing ? 'pencil' : 'plus'}
        title={editing ? 'עריכת מוצר' : 'הוספת מוצר חדש'}
        subtitle={editing ? 'עדכון שם המוצר' : 'הוספת קרם חדש לקטלוג'}
        onClose={onClose}
      />
      <div className="p-7 flex flex-col gap-5">
        <Field label="שם המוצר">
          <TextInput
            autoFocus
            value={name}
            onChange={e => { setName(e.target.value); setErr(''); }}
            onKeyDown={e => { if (e.key === 'Enter') submit(); }}
            placeholder="לדוגמה: סרום ויטמין C"
          />
        </Field>
        {err && <div className="text-sm text-rose-600 font-medium flex items-center gap-1.5"><Icon name="alert-circle" size={15} /> {err}</div>}
      </div>
      <div className="flex items-center justify-end gap-2.5 px-7 py-5 border-t border-blush-100 bg-blush-50/40">
        <Button variant="ghost" onClick={onClose}>ביטול</Button>
        <Button variant="primary" icon="check" onClick={submit}>{editing ? 'שמירת שינויים' : 'הוספת מוצר'}</Button>
      </div>
    </Modal>
  );
}

function Inventory({ products, setProducts, clients }) {

      return exists ? ps.map(p => p.id === data.id ? data : p) : [data, ...ps];

      {form !== undefined && (
        <ProductForm initial={form} products={products} onClose={() => setForm(undefined)} onSave={saveProduct} />

      {confirmDel && (
        <Modal open={true} onClose={() => setConfirmDel(null)} max="max-w-md">

            <span className="grid place-items-center w-14 h-14 rounded-2xl bg-rose-50 text-rose-500 mx-auto mb-4"><Icon name="trash-2" size={26} /></span>

            <p className="text-berry-700/60 mt-2">האם למחוק את <strong className="text-berry-800">{confirmDel.name}</strong> מהקטלוג?</p>
            <div className="flex gap-2.5 justify-center mt-6">

              <Button variant="danger" icon="trash-2" onClick={() => deleteProduct(confirmDel)}>כן, מחקי</Button>
            </div>
          </div>
        </Modal>
      )}
    </div>
  );

    <aside className="hidden lg:flex flex-col w-72 flex-none p-5 gap-2 border-l border-blush-100 bg-white/55 backdrop-blur-md">
      {/* brand */}
      <div className="flex items-center gap-3 px-2 py-3 mb-2">
        <span className="grid place-items-center w-12 h-12 rounded-2xl text-white shadow-royal bg-gradient-to-br from-blush-500 via-rosegold-500 to-gold-500">
          <Icon name="crown" size={24} />
        </span>
        <div className="leading-tight">
          <div className="font-display text-xl font-bold text-berry-800">נועה טל-אל</div>
          <div className="text-[12px] text-berry-700/45 font-medium">קוסמטיקה מתקדמת</div>
        </div>
      </div>

      <nav className="flex flex-col gap-1.5">
        {nav.map((n) =>
        <div key={n.key} className="relative">
            <NavItem icon={n.icon} label={n.label} active={tab === n.key} onClick={() => goTo(n.key)} />
          </div>
        )}
      </nav>

      <div className="mt-auto flex flex-col gap-2">
        <div className="rounded-3xl p-5 bg-gradient-to-br from-blush-100 to-blush-50 border border-white text-center">
          <span className="grid place-items-center w-11 h-11 rounded-2xl bg-white text-blush-500 mx-auto shadow-royal-sm mb-3"><Icon name="sparkles" size={20} /></span>
          <p className="text-[13px] font-semibold text-berry-800 leading-snug">ניהול קליניקה<br />בנגיעה מלכותית</p>
          <p className="text-[11px] text-berry-700/45 mt-1">גרסת הדגמה · 2025</p>
        </div>
        <button onClick={onLogout} className="flex items-center gap-3 px-4 py-3 rounded-2xl text-[15px] font-semibold text-berry-700/60 hover:text-rose-600 hover:bg-rose-50 transition">
          <Icon name="log-out" size={20} /> התנתקות
        </button>
      </div>
    </aside>);

}

function MobileNav({ tab, goTo }) {
  const nav = [
  { key: 'dashboard', icon: 'layout-dashboard', label: 'בקרה' },
  { key: 'clients', icon: 'users', label: 'לקוחות' },
  { key: 'inventory', icon: 'package', label: 'מוצרים' }];

  return (
    <nav className="lg:hidden fixed bottom-0 inset-x-0 z-30 flex justify-around items-center bg-white/90 backdrop-blur-md border-t border-blush-100 px-2 py-2 pb-[calc(0.5rem+env(safe-area-inset-bottom))]">
      {nav.map((n) =>
      <button key={n.key} onClick={() => goTo(n.key)} className={`flex flex-col items-center gap-0.5 px-4 py-1.5 rounded-xl text-[11px] font-semibold transition ${tab === n.key ? 'text-blush-600' : 'text-berry-700/45'}`}>
          <Icon name={n.icon} size={22} />
          {n.label}
        </button>
      )}
    </nav>);

}

function App() {
  const [user, setUser] = useState(() => {
    try { return localStorage.getItem(window.AUTH_KEY) || null; } catch (_) { return null; }
  });
  const [tab, setTab] = useState('dashboard');
  const [focusId, setFocusId] = useState(null);
  const [clients, setClients] = useState(window.CLIENTS_SEED);
  const [products, setProducts] = useState(window.PRODUCTS_SEED);

  function logout() {
    try { localStorage.removeItem(window.AUTH_KEY); } catch (_) {}
    setUser(null);
    setTab('dashboard');
  }

  function goTo(t, clientId) {
    setTab(t);
    if (clientId) setFocusId(clientId);
    if (typeof window !== 'undefined') window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  const titles = {
    dashboard: 'לוח בקרה',
    clients: 'ספר לקוחות',
    inventory: 'מוצרים'
  };

  if (!user) {
    return <LoginScreen onAuth={setUser} />;
  }

  return (
    <div className="min-h-screen flex">
      <Sidebar tab={tab} goTo={goTo} onLogout={logout} />

      <main className="flex-1 min-w-0 flex flex-col">
        {/* topbar */}
        <header className="sticky top-0 z-20 flex items-center justify-between gap-4 px-5 sm:px-8 py-4 bg-white/70 backdrop-blur-md border-b border-blush-100">
          <div className="flex items-center gap-3">
            <span className="lg:hidden grid place-items-center w-10 h-10 rounded-2xl text-white bg-gradient-to-br from-blush-500 to-rosegold-500 shadow-royal-sm"><Icon name="crown" size={20} /></span>
            <div className="flex items-center gap-2 text-sm text-berry-700/50">
              <Icon name="crown" size={15} className="hidden sm:block text-gold-500" />
              <span className="hidden sm:inline">נועה. טל-אל קוסמטיקה</span>
              <span className="hidden sm:inline text-berry-700/25">/</span>
              <span className="font-semibold text-berry-800">{titles[tab]}</span>
            </div>
          </div>
        </header>

        {/* content */}
        <div className="flex-1 px-5 sm:px-8 py-6 sm:py-8 pb-28 lg:pb-8 max-w-[1320px] w-full mx-auto">
          {tab === 'dashboard' && <Dashboard clients={clients} products={products} goTo={goTo} />}
          {tab === 'clients' && <Clients clients={clients} products={products} setClients={setClients} focusId={focusId} clearFocus={() => setFocusId(null)} />}
          {tab === 'inventory' && <Inventory products={products} setProducts={setProducts} clients={clients} />}
        </div>
      </main>

      <MobileNav tab={tab} goTo={goTo} />
    </div>);

}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
